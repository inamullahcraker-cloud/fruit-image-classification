
services:
  fruit-classifier:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: fruit-image-classifier

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    volumes:
      - .:/app
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./reports:/app/reports

    working_dir: /app

    command: >
      uvicorn src.deployment.api:app
      --host 0.0.0.0
      --port 8000
      --reload
